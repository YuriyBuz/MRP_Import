<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRP · Foodline Supply Deck</title>

<link rel="apple-touch-icon" href="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp">
<meta name="theme-color" content="#04060D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<style>
/* ================= ТЕМИ ================= */
html[data-theme="dark"]{
  --void:#04060D; --deck:#0C1626; --hull:#132038; --hull2:#1A2A47;
  --line:rgba(150,195,255,.24); --line2:rgba(150,195,255,.42); --grid:rgba(120,180,255,.055);
  --ion:#5FD4FF; --ion-soft:rgba(95,212,255,.16);
  --gold:#FFBC4D; --flare:#FF6B85; --jade:#4EE8A6; --violet:#A78BFA;
  --ink:#F2F7FF; --mute:#AFC4E0; --dim:#8AA2C0;
  --glow:0 0 26px rgba(95,212,255,.30);
  --shadow:0 20px 50px -34px rgba(0,0,0,.9);
  --sheen:rgba(255,255,255,.03);
}
html[data-theme="light"]{
  --void:#EEF2F8; --deck:#FFFFFF; --hull:#FFFFFF; --hull2:#F2F6FB;
  --line:#CBD8E8; --line2:#A7BCD4; --grid:rgba(12,60,120,.045);
  --ion:#0A62C4; --ion-soft:rgba(10,98,196,.10);
  --gold:#9A5B00; --flare:#C01741; --jade:#0B7047; --violet:#6D4AC9;
  --ink:#0B1626; --mute:#42566E; --dim:#61758F;
  --glow:0 0 0 1px rgba(10,98,196,.14);
  --shadow:0 12px 32px -26px rgba(11,22,38,.5);
  --sheen:rgba(11,22,38,.02);
}
:root{--radius:14px}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--void); color:var(--ink);
  font-family:'Exo 2',system-ui,sans-serif; font-size:14px;
  background-image:
    radial-gradient(1200px 620px at 50% -12%, var(--ion-soft), transparent 62%),
    linear-gradient(transparent 95%, var(--grid) 95%),
    linear-gradient(90deg, transparent 95%, var(--grid) 95%);
  background-size:auto, 34px 34px, 34px 34px;
  min-height:100vh; padding-bottom:60px;
  transition:background-color .2s, color .2s;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--ion);outline-offset:2px}

/* ================= HUD ================= */
.hud{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb, var(--deck) 92%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 var(--ion-soft), var(--shadow);
  padding:12px 22px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand img{height:26px;width:auto}
html[data-theme="dark"] .brand img{filter:brightness(2) saturate(.15)}
.wordmark{font-weight:800;font-size:17px;letter-spacing:.24em;text-transform:uppercase}
.wordmark span{color:var(--ion)}
.hud-tel{display:flex;gap:18px;flex:1;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.tel b{display:block;color:var(--ink);font-size:12.5px;letter-spacing:.04em;margin-top:2px}
.tel .warn{color:var(--gold)}
.hud-act{display:flex;gap:8px;flex-wrap:wrap}

.btn{
  border:1px solid var(--line2); background:var(--hull); color:var(--ink);
  padding:8px 14px; border-radius:9px; font-size:11.5px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; display:inline-flex; align-items:center; gap:7px;
  transition:.18s;
}
.btn:hover{border-color:var(--ion);box-shadow:var(--glow)}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn-key{background:color-mix(in srgb, var(--gold) 16%, var(--hull));border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:6px 11px;font-size:10.5px}
.btn-ic{padding:8px 11px}

/* ================= каркас ================= */
.shell{max-width:1620px;margin:0 auto;padding:22px}
.panel{
  background:linear-gradient(180deg,var(--hull),var(--deck));
  border:1px solid var(--line); border-radius:var(--radius);
  position:relative; overflow:hidden; box-shadow:var(--shadow);
}
.panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--ion),transparent);opacity:.55;
}
.eyebrow{
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:10px;
}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--line)}

/* ================= горизонт ================= */
.horizon{padding:18px 20px 8px;margin-bottom:18px}
.horizon svg{width:100%;height:auto;display:block;margin-top:14px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:10.5px;color:var(--mute);padding:6px 2px 10px}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ================= плитки ================= */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.tile{padding:14px 16px}
.tile .k{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.tile .v{font-size:30px;font-weight:700;line-height:1.1;margin-top:6px}
.tile .s{font-size:10.5px;color:var(--mute);margin-top:2px}
.v-now{color:var(--flare)}
.v-soon{color:var(--gold)}
.v-ion{color:var(--ion)}

/* ================= панель фільтрів ================= */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.field{
  background:var(--deck);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);padding:9px 12px;font-size:13px;
}
.field:focus{border-color:var(--ion);box-shadow:var(--glow);outline:none}
.search{min-width:230px}

/* ================= картка ================= */
.card{margin-bottom:14px}
.card-grid{display:grid;grid-template-columns:minmax(300px,1.05fr) 158px repeat(3,minmax(238px,1fr))}
.pad{padding:16px}
.cell{border-left:1px solid var(--line)}
.idx{font-size:10px;color:var(--dim);letter-spacing:.2em}
.name-in{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--ink);font-size:15px;font-weight:600;padding:6px 0;margin:4px 0 14px;
}
.name-in:focus{border-color:var(--ion);outline:none}
.duo{display:flex;gap:10px}
.lab{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:5px}
.num-in{
  width:100%;background:var(--deck);border:1px solid var(--line);border-radius:8px;
  color:var(--ion);padding:7px 9px;font-size:14px;font-weight:700;
  font-family:'JetBrains Mono',monospace;
}
.num-in:focus{border-color:var(--ion);box-shadow:var(--glow);outline:none}
.date-in{
  width:100%;background:var(--deck);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:6px 7px;font-size:12px;font-family:'JetBrains Mono',monospace;
}
html[data-theme="dark"] .date-in::-webkit-calendar-picker-indicator{filter:invert(.85) sepia(1) saturate(4) hue-rotate(165deg)}
.txt-in{
  width:100%;background:var(--deck);border:1px solid var(--line);border-radius:8px;
  color:var(--mute);padding:5px 8px;font-size:11px;font-family:'JetBrains Mono',monospace;
}
.real{margin-top:12px;font-size:11.5px;color:var(--mute);line-height:1.65}
.real b{color:var(--ink);font-family:'JetBrains Mono',monospace}

.gate{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px}
.gate .when{font-size:19px;font-weight:700;font-family:'JetBrains Mono',monospace}
.gate .cap{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.gate .sub{font-size:10.5px;color:var(--mute);line-height:1.4}
.g-now{color:var(--flare)}
.g-soon{color:var(--gold)}
.g-ok{color:var(--jade)}
.g-idle{color:var(--dim)}

/* ================= слот доставки ================= */
.slot{position:relative}
.slot.live{background:linear-gradient(180deg,var(--ion-soft),transparent 70%)}
.slot-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.slot-n{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600}
.slot.live .slot-n{color:var(--ion)}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end;margin-bottom:10px}
.transit{font-size:9.5px;color:var(--ion);text-align:center;padding-bottom:8px;white-space:nowrap}
.proj{border-top:1px solid var(--line);padding-top:9px;margin-top:10px;font-size:11px;display:grid;grid-template-columns:1fr auto;gap:5px;color:var(--mute)}
.proj b{font-family:'JetBrains Mono',monospace;color:var(--ink);font-size:12.5px}
.proj b.neg{color:var(--flare)}
.proj b.pos{color:var(--jade)}
.short{
  margin-top:8px;font-size:10.5px;line-height:1.45;color:var(--flare);
  border-left:2px solid var(--flare);padding-left:8px;
}

/* ---- конвеєр етапів ---- */
.pipe{display:flex;gap:3px;margin:10px 0 6px}
.pipe button{
  flex:1;height:16px;border-radius:4px;border:1px solid var(--line);
  background:var(--deck);padding:0;position:relative;transition:.15s;
}
.pipe button:hover{border-color:var(--ion)}
.pipe button.on{background:var(--ion);border-color:var(--ion)}
.pipe button.on.done{background:var(--jade);border-color:var(--jade)}
.pipe button.cur{box-shadow:var(--glow)}
.pipe button span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:7.5px;font-weight:700;letter-spacing:.02em;color:var(--dim);
}
.pipe button.on span{color:var(--void)}
.stage-now{font-size:10.5px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;align-items:center}
.stage-now b{color:var(--ion);font-weight:600}
.pays{display:flex;gap:4px}
.pays button{
  border:1px solid var(--line);background:var(--deck);color:var(--dim);
  font-size:9.5px;padding:3px 8px;border-radius:20px;transition:.15s;
}
.pays button:hover{border-color:var(--gold)}
.pays button.on{background:color-mix(in srgb, var(--gold) 20%, var(--deck));border-color:var(--gold);color:var(--gold);font-weight:700}

.rim{height:2px;background:linear-gradient(90deg,transparent,var(--ion),transparent);opacity:.4}
.rim-now{background:linear-gradient(90deg,transparent,var(--flare),transparent);opacity:.85}
.rim-soon{background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}

.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.flag{
  font-size:9.5px;padding:3px 9px;border-radius:20px;
  border:1px solid var(--gold);color:var(--gold);
  background:color-mix(in srgb, var(--gold) 12%, transparent);
}
.flag.bad{border-color:var(--flare);color:var(--flare);background:color-mix(in srgb, var(--flare) 12%, transparent)}

.drawer{border-top:1px solid var(--line);background:var(--sheen);padding:18px}
.ai-text{white-space:pre-wrap;line-height:1.75;font-size:13px;color:var(--ink);max-height:520px;overflow:auto}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--hull);border:1px solid var(--line2);border-radius:11px;
  padding:12px 20px;font-size:13px;box-shadow:var(--shadow);color:var(--ink);
}
.toast.err{border-color:var(--flare);color:var(--flare)}

.empty{text-align:center;padding:64px 24px;color:var(--mute)}
.empty h2{font-weight:600;font-size:17px;color:var(--ink);margin:0 0 8px}

.sett{max-width:760px;margin:0 auto}
.sett h3{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ion);margin:26px 0 12px;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hint{font-size:10.5px;color:var(--dim);margin-top:5px;line-height:1.55}

@media (max-width:1240px){
  .card-grid{grid-template-columns:1fr 1fr}
  .cell{border-left:none;border-top:1px solid var(--line)}
}
@media (max-width:760px){
  .card-grid{grid-template-columns:1fr}
  .shell{padding:14px}
  .hud{padding:10px 14px;gap:12px}
}
@media (prefers-reduced-motion:no-preference){
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .scan{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .scan i{position:absolute;top:0;bottom:0;width:34%;
    background:linear-gradient(90deg,transparent,var(--ion-soft),transparent);
    animation:sweep 9s linear infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .pulse{animation:pulse 2.2s ease-in-out infinite}
}
.no-print{}
body.printing .no-print{display:none !important}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ================= утиліти ================= */
const DAY = 86400000;
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s|\u00A0/g,'').replace(',','.')); return isFinite(n) ? n : 0; };
const midnight = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const parseISO = s => { const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; };
const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayDiff = (a,b) => Math.round((midnight(b) - midnight(a)) / DAY);
const addDays = (d,n) => new Date(d.getTime() + n*DAY);
const fmtD = d => d ? `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}` : '—';
const fmtN = v => (v===null || v===undefined || !isFinite(v)) ? '—' : Math.round(v).toLocaleString('uk-UA').replace(/,/g,' ');
const fmtM = v => v===Infinity ? '∞' : (isFinite(v) ? v.toFixed(1) : '—');
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ================= етапи ================= */
const STAGES = [
  { k:'plan',    s:'ПЛАН', t:'Заплановано' },
  { k:'ordered', s:'ЗАМ',  t:'Замовлення розміщено' },
  { k:'prod',    s:'ВИР',  t:'У виробництві' },
  { k:'sea',     s:'МОРЕ', t:'У дорозі: море' },
  { k:'port',    s:'ПОРТ', t:'Порт і митниця' },
  { k:'land',    s:'АВТО', t:'У дорозі: авто' },
  { k:'done',    s:'СКЛ',  t:'Прийнято на склад' }
];
const stageIdx = k => STAGES.findIndex(s => s.k === k);
const SHIPPED = ['sea','port','land','done'];
const PAYS = [ {k:'',t:'—',full:'Без оплати'}, {k:'pre',t:'ПЕРЕД',full:'Передоплата'}, {k:'full',t:'ПОВНА',full:'Повна оплата'} ];

/* ================= розрахунок ================= */
const HORIZON = 420;

function analyze(item, ctx){
  const today = ctx.today;
  const stockDate = ctx.stockDate || today;
  const monthly = num(item.consumption);
  const daily = monthly / 30;
  const entered = num(item.stock);
  const lead = ctx.leadTime;
  const safety = monthly * num(ctx.minStock);
  const over = monthly * num(ctx.overStock);

  const dels = [1,2,3].map(n => ({
    n,
    qty: num(item['d'+n+'Qty']),
    send: parseISO(item['d'+n+'Send']),
    arrive: parseISO(item['d'+n+'Date']),
    cont: item['d'+n+'Cont'] || '',
    stage: item['d'+n+'Stage'] || '',
    pay: item['d'+n+'Pay'] || ''
  }));

  const aged = Math.max(0, dayDiff(stockDate, today));
  let stockNow = entered - aged * daily;

  dels.forEach(d => {
    if (d.qty <= 0) return;
    const receivedFlag = d.stage === 'done';
    const arrivedByDate = d.arrive && d.arrive <= today;
    if ((receivedFlag || arrivedByDate) && (!d.arrive || d.arrive > stockDate)) stockNow += d.qty;
  });

  // склад не буває мінусовим: нестача закривається закупівлею на внутрішньому ринку
  let preGap = 0;
  if (stockNow < 0){ preGap = -stockNow; stockNow = 0; }

  const future = dels
    .filter(d => d.qty > 0 && d.arrive && d.arrive > today && d.stage !== 'done')
    .map(d => ({ ...d, day: dayDiff(today, d.arrive), confirmed: SHIPPED.indexOf(d.stage) >= 0 }))
    .sort((a,b) => a.day - b.day);

  // денна симуляція з нулем як підлогою
  const series = new Array(HORIZON + 1);
  const gaps = [];
  let s = stockNow, gFrom = null, gQty = 0;
  for (let d = 0; d <= HORIZON; d++){
    if (d > 0) s -= daily;
    for (const del of future) if (del.day === d) s += del.qty;
    if (s < 0){
      if (gFrom === null) gFrom = d;
      gQty += -s;
      s = 0;
    } else if (gFrom !== null){
      gaps.push({ from:gFrom, to:d-1, qty:gQty });
      gFrom = null; gQty = 0;
    }
    series[d] = s;
  }
  if (gFrom !== null) gaps.push({ from:gFrom, to:HORIZON, qty:gQty, open:true });

  const stockAt = day => series[Math.max(0, Math.min(HORIZON, Math.round(day)))];
  const firstGap = gaps.length ? gaps[0] : null;
  const localBuy = gaps.reduce((t,g) => t + g.qty, 0);

  let firstSafety = null, lastOk = -1;
  if (daily > 0){
    for (let d = 0; d <= HORIZON; d++){
      if (firstSafety === null && series[d] < safety) firstSafety = d;
      if (series[d] >= safety) lastOk = d;
    }
  }
  // останній день стабільного покриття → від нього рахуємо замовлення
  const coverUntil = daily > 0 ? lastOk + 1 : null;
  const beyond = coverUntil !== null && coverUntil > HORIZON;
  const orderDay = (coverUntil === null || beyond) ? null : coverUntil - lead;

  let state = 'ok';
  if (monthly <= 0) state = 'idle';
  else if (orderDay !== null && orderDay <= 0) state = 'now';
  else if (orderDay !== null && orderDay <= 30) state = 'soon';
  else if (over > 0 && stockNow > over) state = 'over';

  const slots = {};
  dels.forEach(d => {
    if (!d.arrive){ slots[d.n] = null; return; }
    const day = dayDiff(today, d.arrive);
    if (d.stage === 'done'){ slots[d.n] = { received:true }; return; }
    if (day <= 0){ slots[d.n] = { arrived:true, day }; return; }
    const before = series[Math.max(0, Math.min(HORIZON, day - 1))];
    const after  = series[Math.min(HORIZON, day)];
    const g = gaps.filter(x => x.from <= day - 1 && x.to >= day - 1)[0];
    slots[d.n] = {
      day, before, after,
      coversTo: monthly > 0 ? after / monthly : Infinity,
      gapQty: g ? g.qty : 0,
      gapFrom: g ? addDays(today, g.from) : null,
      gapDays: g ? (Math.min(g.to, day - 1) - g.from + 1) : 0
    };
  });

  const flags = [];
  dels.forEach(d => {
    if (d.send && d.arrive && d.arrive < d.send) flags.push({t:`Поставка ${d.n}: прибуття раніше за відправку`, bad:true});
    if (d.send && d.arrive && dayDiff(d.send, d.arrive) > 150) flags.push({t:`Поставка ${d.n}: транзит ${dayDiff(d.send,d.arrive)} дн — перевірте рік`, bad:true});
    if (d.arrive && dayDiff(today, d.arrive) > 270) flags.push({t:`Поставка ${d.n}: прибуття ${fmtD(d.arrive)} — перевірте рік`, bad:false});
    if (d.qty > 0 && !d.arrive) flags.push({t:`Поставка ${d.n}: є кількість, немає дати прибуття`, bad:false});
    if (d.arrive && d.qty <= 0) flags.push({t:`Поставка ${d.n}: є дата, немає кількості`, bad:false});
    if (d.qty > 0 && d.arrive && d.arrive > today && !d.stage) flags.push({t:`Поставка ${d.n}: не вказано етап`, bad:false});
  });
  if (monthly <= 0 && entered > 0) flags.push({t:'Витрата не вказана — покриття не рахується', bad:false});
  if (preGap > 0) flags.push({t:`Запас вичерпано ще до сьогодні · добрано на ринку ≈ ${fmtN(preGap)} шт`, bad:true});
  // тимчасовий провал нижче мінімуму, який далі закривається поставкою
  if (firstSafety !== null && coverUntil !== null && firstSafety < coverUntil)
    flags.push({t:`Тимчасово нижче мінімуму з ${fmtD(addDays(today, firstSafety))}`, bad:false});

  return {
    monthly, daily, entered, aged, stockNow, safety, over,
    covNow: monthly > 0 ? stockNow / monthly : Infinity,
    dels, future, slots, flags, state,
    series, gaps, firstGap, localBuy, preGap,
    firstZero: firstGap ? firstGap.from : null,
    coverUntil, beyond, orderDay,
    zeroDate: firstGap ? addDays(today, firstGap.from) : null,
    zeroEndDate: (firstGap && !firstGap.open) ? addDays(today, firstGap.to) : null,
    coverDate: (coverUntil === null || beyond) ? null : addDays(today, coverUntil),
    orderDate: orderDay === null ? null : addDays(today, orderDay),
    stockAt
  };
}

/* ================= горизонт ================= */
function Horizon({ rows, today, onPick, theme }){
  const W = 1560, padL = 262, padR = 34, padT = 28, rowH = 18;
  const days = 365, inner = W - padL - padR;
  const H = padT + rows.length * rowH + 28;
  const x = d => padL + (d / days) * inner;
  const axis = theme === 'light' ? '#61758F' : '#8AA2C0';
  const grid = theme === 'light' ? 'rgba(12,60,120,.10)' : 'rgba(150,195,255,.10)';

  const months = [];
  for (let i = 0; i <= days; i++){
    const dt = addDays(today, i);
    if (dt.getDate() === 1) months.push({ d:i, dt });
  }

  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" role="img" aria-label="Горизонт постачання">
      {months.map(m => (
        <g key={m.d}>
          <line x1={x(m.d)} y1={padT-8} x2={x(m.d)} y2={H-22} stroke={grid}/>
          <text x={x(m.d)} y={H-6} fill={axis} fontSize="10.5" textAnchor="middle" fontFamily="JetBrains Mono, monospace">
            {m.dt.getMonth()===0
              ? m.dt.toLocaleDateString('uk-UA',{month:'short'}).toUpperCase()+" '"+String(m.dt.getFullYear()).slice(2)
              : m.dt.toLocaleDateString('uk-UA',{month:'short'})}
          </text>
        </g>
      ))}

      <line x1={x(0)} y1={padT-14} x2={x(0)} y2={H-22} stroke="var(--ion)" strokeWidth="2" opacity=".8"/>
      <text x={x(0)} y={padT-19} fill="var(--ion)" fontSize="10" textAnchor="middle"
            fontFamily="JetBrains Mono, monospace" letterSpacing="1.5">СЬОГОДНІ</text>

      {rows.map((r, i) => {
        const y = padT + i * rowH, a = r.a;
        const cells = [];
        for (let w = 0; w < 52; w++){
          const s = a.stockAt(w*7);
          let fill = 'var(--jade)', op = .8;
          if (a.monthly <= 0){ fill = 'var(--dim)'; op = .3; }
          else if (s < 0){ fill = 'var(--flare)'; op = 1; }
          else if (s < a.safety){ fill = 'var(--gold)'; op = .95; }
          cells.push(<rect key={w} x={x(w*7)} y={y+4} width={inner/52 - 1} height="8" rx="1.5" fill={fill} opacity={op}/>);
        }
        return (
          <g key={r.item.id} style={{cursor:'pointer'}} onClick={() => onPick(r.item.id)}>
            <text x={padL-12} y={y+12} fontSize="11.5" textAnchor="end"
                  fill={a.state==='now'?'var(--flare)':a.state==='soon'?'var(--gold)':'var(--mute)'}>
              {r.item.name.length > 40 ? r.item.name.slice(0,39)+'…' : r.item.name}
            </text>
            {cells}
            {a.future.map(d => d.day <= days && (
              <g key={d.n}>
                <line x1={x(d.day)} y1={y+2} x2={x(d.day)} y2={y+14} stroke="var(--ion)" strokeWidth="2"/>
                <circle cx={x(d.day)} cy={y+8} r="4"
                        fill={d.confirmed ? 'var(--ion)' : 'var(--void)'}
                        stroke="var(--ion)" strokeWidth="1.6"/>
              </g>
            ))}
            {a.orderDay !== null && a.orderDay > 0 && a.orderDay <= days && (
              <polygon points={`${x(a.orderDay)},${y+1} ${x(a.orderDay)+5},${y+8} ${x(a.orderDay)},${y+15} ${x(a.orderDay)-5},${y+8}`} fill="var(--gold)"/>
            )}
            {a.orderDay !== null && a.orderDay <= 0 && (
              <polygon className="pulse" points={`${x(0)},${y+1} ${x(0)+5},${y+8} ${x(0)},${y+15} ${x(0)-5},${y+8}`} fill="var(--flare)"/>
            )}
          </g>
        );
      })}
    </svg>
  );
}

/* ================= графік позиції ================= */
function ItemChart({ a, today, theme }){
  const W = 1200, H = 250, padL = 78, padR = 54, padT = 22, padB = 30;
  const iw = W-padL-padR, ih = H-padT-padB;
  const days = Math.max(220, ...a.future.map(d => d.day + 45));
  const pts = [];
  for (let d = 0; d <= days; d += 2) pts.push({d, s:a.stockAt(d)});
  const vals = pts.map(p => p.s).concat([a.safety, a.over, 0]);
  const yMax = Math.max(...vals) * 1.12 || 1;
  const yMin = Math.min(...vals, 0) * 1.15;
  const X = d => padL + (d/days)*iw;
  const Y = s => padT + ih - ((s - yMin)/((yMax-yMin)||1))*ih;
  const path = pts.map((p,i) => `${i?'L':'M'} ${X(p.d).toFixed(1)},${Y(p.s).toFixed(1)}`).join(' ');
  const axis = theme === 'light' ? '#61758F' : '#8AA2C0';
  const ticks = []; for (let d = 0; d <= days; d += 30) ticks.push(d);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
      <defs>
        <linearGradient id="fillG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--ion)" stopOpacity=".32"/>
          <stop offset="100%" stopColor="var(--ion)" stopOpacity="0"/>
        </linearGradient>
      </defs>
      {ticks.map(d => (
        <g key={d}>
          <line x1={X(d)} y1={padT} x2={X(d)} y2={H-padB} stroke="var(--line)" opacity=".5"/>
          <text x={X(d)} y={H-padB+16} fill={axis} fontSize="10" textAnchor="middle" fontFamily="JetBrains Mono, monospace">
            {fmtD(addDays(today,d)).slice(0,5)}
          </text>
        </g>
      ))}
      {a.over > 0 && a.over < yMax && (
        <g><line x1={padL} y1={Y(a.over)} x2={W-padR} y2={Y(a.over)} stroke="var(--violet)" strokeDasharray="6 5" strokeWidth="1.3"/>
           <text x={padL-8} y={Y(a.over)+4} fill="var(--violet)" fontSize="10.5" textAnchor="end">оверсток</text></g>
      )}
      {a.safety > 0 && (
        <g><line x1={padL} y1={Y(a.safety)} x2={W-padR} y2={Y(a.safety)} stroke="var(--gold)" strokeDasharray="6 5" strokeWidth="1.3"/>
           <text x={padL-8} y={Y(a.safety)+4} fill="var(--gold)" fontSize="10.5" textAnchor="end">мін. запас</text></g>
      )}
      <line x1={padL} y1={Y(0)} x2={W-padR} y2={Y(0)} stroke="var(--flare)" strokeWidth="1.3" strokeDasharray="4 4"/>
      <text x={padL-8} y={Y(0)+4} fill="var(--flare)" fontSize="10.5" textAnchor="end">0</text>

      {(a.gaps||[]).filter(g => g.from <= days).map((g,i) => (
        <g key={'g'+i}>
          <rect x={X(g.from)} y={padT} width={Math.max(2, X(Math.min(g.to+1, days)) - X(g.from))} height={ih}
                fill="var(--flare)" opacity=".13"/>
          <text x={X(g.from)+4} y={padT+13} fill="var(--flare)" fontSize="10.5" fontWeight="700">ринок ≈ {fmtN(g.qty)}</text>
        </g>
      ))}
      <path d={`${path} L ${X(days)},${Y(yMin)} L ${padL},${Y(yMin)} Z`} fill="url(#fillG)"/>
      <path d={path} fill="none" stroke="var(--ion)" strokeWidth="2.4" strokeLinejoin="round"/>

      {a.future.map(d => (
        <g key={d.n}>
          <line x1={X(d.day)} y1={padT} x2={X(d.day)} y2={H-padB} stroke="var(--ion)" strokeDasharray="3 4" opacity=".45"/>
          <circle cx={X(d.day)} cy={Y(a.stockAt(d.day))} r="5" fill={d.confirmed?'var(--jade)':'var(--void)'} stroke="var(--jade)" strokeWidth="2"/>
          <text x={X(d.day)} y={Y(a.stockAt(d.day))-13} fill="var(--jade)" fontSize="11" textAnchor="middle" fontFamily="JetBrains Mono, monospace">
            +{fmtN(d.qty)}
          </text>
        </g>
      ))}
      {a.orderDay !== null && a.orderDay >= 0 && a.orderDay <= days && (
        <g><line x1={X(a.orderDay)} y1={padT} x2={X(a.orderDay)} y2={H-padB} stroke="var(--gold)" strokeWidth="1.8"/>
           <text x={X(a.orderDay)+6} y={padT+12} fill="var(--gold)" fontSize="11" fontWeight="700">замовити</text></g>
      )}
      <circle cx={X(0)} cy={Y(a.stockNow)} r="5" fill="var(--ion)"/>
    </svg>
  );
}

/* ================= слот доставки ================= */
function Slot({ n, item, a, onChange }){
  const s = a.slots[n];
  const send = item['d'+n+'Send'], arrive = item['d'+n+'Date'];
  const qty = item['d'+n+'Qty'], cont = item['d'+n+'Cont'];
  const stage = item['d'+n+'Stage'] || '', pay = item['d'+n+'Pay'] || '';
  const live = num(qty) > 0 || !!arrive || !!send;
  const sd = parseISO(send), ad = parseISO(arrive);
  const transit = (sd && ad) ? dayDiff(sd, ad) : null;
  const cur = stageIdx(stage);

  return (
    <div className={`pad cell slot ${live?'live':''}`}>
      <div className="slot-h">
        <span className="slot-n">Поставка {n}</span>
        <input className="txt-in" style={{width:'118px'}} value={cont||''} placeholder="контейнер"
               onChange={e => onChange(`d${n}Cont`, e.target.value)}/>
      </div>

      <div className="route">
        <div>
          <span className="lab">Відправка</span>
          <input type="date" className="date-in" value={send||''} onChange={e => onChange(`d${n}Send`, e.target.value)}/>
        </div>
        <div className="transit">{transit !== null ? `${transit} дн` : '·'}</div>
        <div>
          <span className="lab">Прибуття</span>
          <input type="date" className="date-in" value={arrive||''} onChange={e => onChange(`d${n}Date`, e.target.value)}/>
        </div>
      </div>

      <div>
        <span className="lab">Кількість, шт</span>
        <input type="number" className="num-in" value={qty===0?'':qty} placeholder="0"
               onChange={e => onChange(`d${n}Qty`, e.target.value)}/>
      </div>

      <div className="pipe no-print">
        {STAGES.map((st, i) => (
          <button key={st.k} title={st.t}
                  className={(cur >= 0 && i <= cur ? 'on ' : '') + (st.k==='done' && cur===i ? 'done ' : '') + (i===cur ? 'cur' : '')}
                  onClick={() => onChange(`d${n}Stage`, stage === st.k ? '' : st.k)}>
            <span>{st.s}</span>
          </button>
        ))}
      </div>
      <div className="stage-now">
        <b>{cur >= 0 ? STAGES[cur].t : 'Етап не вказано'}</b>
        <span className="pays no-print">
          {PAYS.map(p => (
            <button key={p.k} title={p.full} className={pay === p.k ? 'on' : ''}
                    onClick={() => onChange(`d${n}Pay`, p.k)}>{p.t}</button>
          ))}
        </span>
      </div>

      <div className="proj">
        {!s ? <><span>Порожній слот</span><b>—</b></> :
         s.received ? <><span>Прийнято на склад</span><b className="pos">у залишку</b></> :
         s.arrived ? <><span>Дата минула</span><b className="neg">підтвердіть приймання</b></> :
         <>
           <span>Запас перед приходом</span><b className={s.gapQty > 0 ? 'neg' : ''}>{fmtN(s.before)}</b>
           <span>Після приходу</span><b className="pos">{fmtN(s.after)} · {fmtM(s.coversTo)} міс</b>
         </>}
      </div>
      {s && !s.received && !s.arrived && s.gapQty > 0 && (
        <div className="short">
          Свій запас закінчиться {fmtD(s.gapFrom)}. До приходу {s.gapDays} дн на закупівлі з внутрішнього ринку — приблизно {fmtN(s.gapQty)} шт.
        </div>
      )}
    </div>
  );
}

/* ================= картка ================= */
function Card({ item, a, index, theme, onChange, onRemove, chart, ai, onChart, onAi, aiText, aiBusy }){
  const g = a.state==='now' ? 'g-now' : a.state==='soon' ? 'g-soon' : a.state==='idle' ? 'g-idle' : 'g-ok';
  const rim = a.state==='now' ? 'rim rim-now' : a.state==='soon' ? 'rim rim-soon' : 'rim';
  return (
    <div className="panel card" id={'item-'+item.id}>
      <div className={rim}></div>
      <div className="card-grid">
        <div className="pad">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span className="idx mono">{String(index+1).padStart(2,'0')}</span>
            <button className="btn btn-sm no-print" onClick={onRemove} title="Видалити позицію">✕</button>
          </div>
          <input className="name-in" value={item.name} onChange={e => onChange('name', e.target.value)}/>
          <div className="duo">
            <div style={{flex:1}}>
              <span className="lab">Залишок у таблиці</span>
              <input type="number" className="num-in" value={item.stock} onChange={e => onChange('stock', e.target.value)}/>
            </div>
            <div style={{flex:1}}>
              <span className="lab">Витрата / міс</span>
              <input type="number" className="num-in" value={item.consumption} onChange={e => onChange('consumption', e.target.value)}/>
            </div>
          </div>
          <div className="real">
            Розрахунок на сьогодні: <b style={{color:a.stockNow<0?'var(--flare)':'var(--ion)'}}>{fmtN(a.stockNow)} шт</b>
            {a.aged > 0 && <> · списано {a.aged} дн</>}<br/>
            Покриття: <b>{fmtM(a.covNow)} міс</b>
            {!a.zeroDate && a.coverDate && <> · запасу до {fmtD(a.coverDate)}</>}
            {a.firstGap && (
              <><br/>Свій запас закінчується <b style={{color:'var(--flare)'}}>{fmtD(a.zeroDate)}</b>
                {a.zeroEndDate ? <> — поставка {fmtD(addDays(a.zeroEndDate,1))}</> : <> — поставки в горизонті немає</>}
                <br/>Закупівля на ринку: <b style={{color:'var(--gold)'}}>≈ {fmtN(a.firstGap.qty)} шт</b> за {a.firstGap.to - a.firstGap.from + 1} дн
              </>
            )}
          </div>
          {a.flags.length > 0 && (
            <div className="flags">{a.flags.map((f,i) => <span key={i} className={'flag'+(f.bad?' bad':'')}>{f.t}</span>)}</div>
          )}
          <div className="flags no-print" style={{marginTop:14}}>
            <button className="btn btn-sm" onClick={onChart}>{chart?'Згорнути графік':'Графік'}</button>
            <button className="btn btn-sm" onClick={onAi} disabled={aiBusy}>{aiBusy?'Аналізую…':'Оцінка ризиків'}</button>
          </div>
        </div>

        <div className="pad cell gate">
          <span className="cap">Замовити до</span>
          <span className={'when '+g}>
            {a.state==='idle' ? '—' : a.beyond ? 'не треба' : a.orderDate ? (a.orderDay <= 0 ? 'ВЖЕ' : fmtD(a.orderDate)) : '—'}
          </span>
          <span className="sub">
            {a.state==='idle' ? 'немає витрати' :
             a.beyond ? 'вистачає за горизонтом' :
             a.orderDay === null ? '' :
             a.orderDay <= 0 ? `прострочено на ${-a.orderDay} дн` : `через ${a.orderDay} дн`}
          </span>
          {a.coverDate && <span className="sub" style={{marginTop:6}}>запас тримається<br/>до {fmtD(a.coverDate)}</span>}
        </div>

        <Slot n={1} item={item} a={a} onChange={onChange}/>
        <Slot n={2} item={item} a={a} onChange={onChange}/>
        <Slot n={3} item={item} a={a} onChange={onChange}/>
      </div>

      {chart && <div className="drawer"><ItemChart a={a} today={midnight(new Date())} theme={theme}/></div>}
      {ai && (
        <div className="drawer">
          <div className="eyebrow" style={{marginBottom:12}}>Оцінка ризиків</div>
          {aiBusy ? <div style={{color:'var(--ion)'}} className="pulse">Аналізую маршрут, календар і залишки…</div>
                  : <div className="ai-text">{aiText}</div>}
        </div>
      )}
    </div>
  );
}

/* ================= додаток ================= */
function App(){
  const [items, setItems] = useState([]);
  const [tab, setTab] = useState('deck');
  const [busy, setBusy] = useState(false);
  const [saving, setSaving] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [revision, setRevision] = useState(null);
  const [meta, setMeta] = useState({});
  const [toast, setToast] = useState(null);
  const [chartOpen, setChartOpen] = useState({});
  const [aiOpen, setAiOpen] = useState({});
  const [aiText, setAiText] = useState({});
  const [aiBusy, setAiBusy] = useState({});
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState('urgency');
  const [today, setToday] = useState(() => midnight(new Date()));

  const [cfg, setCfg] = useState(() => Object.assign({
    url:'', token:'', user:'', apiKey:'', theme:'dark',
    order:20, sea:60, port:30, minStock:1.5, overStock:5,
    stockDate: toISO(midnight(new Date()))
  }, store.get('mrp_cfg_v3', store.get('mrp_cfg_v2', {}))));

  useEffect(() => { store.set('mrp_cfg_v3', cfg); }, [cfg]);
  useEffect(() => { document.documentElement.setAttribute('data-theme', cfg.theme || 'dark'); }, [cfg.theme]);
  useEffect(() => {
    const t = setInterval(() => setToday(midnight(new Date())), 3600000);
    return () => clearInterval(t);
  }, []);
  useEffect(() => {
    const warn = e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', warn);
    return () => window.removeEventListener('beforeunload', warn);
  }, [dirty]);
  useEffect(() => { if (cfg.url && cfg.token) load(true); }, []);

  const say = (text, err) => { setToast({text, err}); setTimeout(() => setToast(null), 5000); };
  const leadTime = num(cfg.order) + num(cfg.sea) + num(cfg.port);

  const call = async payload => {
    if (!cfg.url) throw new Error('не вказано адресу скрипта');
    if (!cfg.token) throw new Error('не вказано токен доступу');
    const res = await fetch(cfg.url, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ token: cfg.token.trim(), user: cfg.user || 'без імені' }, payload))
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  };

  const load = async silent => {
    if (dirty && !silent && !confirm('Є незбережені зміни. Синхронізація їх затре. Продовжити?')) return;
    setBusy(true);
    try{
      const r = await call({ action:'load' });
      if (r.status !== 'success') throw new Error(r.error || r.code);
      setItems((r.rows||[]).filter(row => String(row[0]||'').trim()).map(row => ({
        id:(self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'i'+Math.random().toString(36).slice(2),
        name:String(row[0]).trim(), stock:num(row[1]), consumption:num(row[2]),
        d1Send:row[3]||'', d1Date:row[4]||'', d1Qty:num(row[5]), d1Cont:String(row[6]||''),
        d2Send:row[7]||'', d2Date:row[8]||'', d2Qty:num(row[9]), d2Cont:String(row[10]||''),
        d3Send:row[11]||'', d3Date:row[12]||'', d3Qty:num(row[13]), d3Cont:String(row[14]||''),
        d1Stage:String(row[15]||''), d1Pay:String(row[16]||''),
        d2Stage:String(row[17]||''), d2Pay:String(row[18]||''),
        d3Stage:String(row[19]||''), d3Pay:String(row[20]||'')
      })));
      setRevision(r.revision);
      setMeta({ at:new Date(), by:r.lastSavedBy });
      setDirty(false);
      if (r.stockLabel){
        const m = String(r.stockLabel).match(/(\d{2})\.(\d{2})\.(\d{4})/);
        if (m) setCfg(c => Object.assign({}, c, { stockDate:`${m[3]}-${m[2]}-${m[1]}` }));
      }
      if (!silent) say('Дані завантажено');
    }catch(e){ say('Не завантажено: ' + e.message, true); }
    finally{ setBusy(false); }
  };

  const save = async (opts = {}) => {
    setSaving(true);
    try{
      const rows = items.map(i => [
        i.name, i.stock, i.consumption,
        i.d1Send, i.d1Date, i.d1Qty, i.d1Cont||'',
        i.d2Send, i.d2Date, i.d2Qty, i.d2Cont||'',
        i.d3Send, i.d3Date, i.d3Qty, i.d3Cont||'',
        i.d1Stage||'', i.d1Pay||'', i.d2Stage||'', i.d2Pay||'', i.d3Stage||'', i.d3Pay||''
      ]);
      const r = await call(Object.assign({ action:'save', rows, revision }, opts));
      if (r.code === 'conflict'){
        setSaving(false);
        if (confirm(`Таблицю змінив «${r.changedBy}» (${r.changedAt}).\nПерезаписати його правки вашими?`))
          return save(Object.assign({}, opts, { overwrite:true }));
        return;
      }
      if (r.code === 'confirm_required'){
        setSaving(false);
        if (confirm(r.error + '\n\nПродовжити?')) return save(Object.assign({}, opts, { confirmDelete:true }));
        return;
      }
      if (r.status !== 'success') throw new Error(r.error || r.code);
      setRevision(r.revision); setDirty(false);
      say(`${r.message}. Резервна копія: ${r.backup}`);
    }catch(e){ say('Не збережено: ' + e.message, true); }
    finally{ setSaving(false); }
  };

  const change = (id, field, value) => {
    setItems(prev => prev.map(i => i.id === id ? Object.assign({}, i, {[field]:value}) : i));
    setDirty(true);
    setAiText(prev => { const n = Object.assign({}, prev); delete n[id]; return n; });
  };
  const addItem = () => {
    setItems(prev => [{
      id:'n'+Date.now(), name:'Нова позиція', stock:0, consumption:0,
      d1Send:'',d1Date:'',d1Qty:0,d1Cont:'',d1Stage:'',d1Pay:'',
      d2Send:'',d2Date:'',d2Qty:0,d2Cont:'',d2Stage:'',d2Pay:'',
      d3Send:'',d3Date:'',d3Qty:0,d3Cont:'',d3Stage:'',d3Pay:''
    }, ...prev]);
    setDirty(true);
  };
  const removeItem = (id, name) => {
    if (!confirm(`Видалити позицію «${name || 'без назви'}»?`)) return;
    setItems(prev => prev.filter(i => i.id !== id));
    setDirty(true);
  };

  const ctx = useMemo(() => ({
    today, stockDate: parseISO(cfg.stockDate) || today,
    leadTime, minStock: cfg.minStock, overStock: cfg.overStock
  }), [today, cfg.stockDate, leadTime, cfg.minStock, cfg.overStock]);

  const rows = useMemo(() => items.map(item => ({ item, a: analyze(item, ctx) })), [items, ctx]);

  const view = useMemo(() => {
    let r = rows.slice();
    if (q.trim()) r = r.filter(x => x.item.name.toLowerCase().includes(q.trim().toLowerCase()));
    if (filter === 'now')   r = r.filter(x => x.a.state === 'now');
    if (filter === 'risk')  r = r.filter(x => x.a.state === 'now' || x.a.state === 'soon');
    if (filter === 'zero')  r = r.filter(x => x.a.firstZero !== null);
    if (filter === 'over')  r = r.filter(x => x.a.state === 'over');
    if (filter === 'flags') r = r.filter(x => x.a.flags.length > 0);
    if (filter === 'unpaid') r = r.filter(x => x.a.dels.some(d => d.qty>0 && d.stage && d.stage!=='done' && !d.pay));
    const key = x => x.a.orderDay === null ? 99999 : x.a.orderDay;
    if (sort === 'urgency') r.sort((x,y) => key(x) - key(y));
    if (sort === 'cover')   r.sort((x,y) => (x.a.covNow===Infinity?9e9:x.a.covNow) - (y.a.covNow===Infinity?9e9:y.a.covNow));
    if (sort === 'name')    r.sort((x,y) => x.item.name.localeCompare(y.item.name,'uk'));
    return r;
  }, [rows, q, filter, sort]);

  const stat = useMemo(() => ({
    total: rows.length,
    now: rows.filter(r => r.a.state === 'now').length,
    soon: rows.filter(r => r.a.state === 'soon').length,
    gaps: rows.filter(r => r.a.firstGap).length,
    transit: rows.reduce((s,r) => s + r.a.future.filter(d => d.confirmed).length, 0),
    planned: rows.reduce((s,r) => s + r.a.future.filter(d => !d.confirmed).length, 0),
    unpaid: rows.reduce((s,r) => s + r.a.dels.filter(d => d.qty>0 && d.stage && d.stage!=='done' && !d.pay).length, 0),
    flags: rows.filter(r => r.a.flags.length > 0).length
  }), [rows]);

  const stale = Math.max(0, dayDiff(parseISO(cfg.stockDate) || today, today));

  const runAi = async (item, a) => {
    const open = !aiOpen[item.id];
    setAiOpen(p => Object.assign({}, p, {[item.id]: open}));
    if (!open || aiText[item.id]) return;
    if (!cfg.apiKey){ setAiText(p => Object.assign({}, p, {[item.id]:'Додайте ключ Gemini у налаштуваннях, щоб отримати оцінку ризиків.'})); return; }
    setAiBusy(p => Object.assign({}, p, {[item.id]:true}));
    try{
      const key = cfg.apiKey.trim();
      const lr = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
      const ld = await lr.json();
      if (!lr.ok) throw new Error(ld?.error?.message || 'ключ відхилено');
      const names = (ld.models||[])
        .filter(m => (m.supportedGenerationMethods||[]).includes('generateContent') && m.name.includes('gemini'))
        .map(m => m.name.replace('models/',''));
      const model = names.find(n => n.includes('flash') && !n.includes('preview') && !n.includes('exp')) || names.find(n => n.includes('flash')) || names[0];
      if (!model) throw new Error('немає доступних моделей');

      const stages = a.dels.filter(d => d.qty > 0).map(d => {
        const st = stageIdx(d.stage) >= 0 ? STAGES[stageIdx(d.stage)].t : 'етап не вказано';
        const pay = (PAYS.find(p => p.k === d.pay) || PAYS[0]).full;
        return `поставка ${d.n}: ${fmtN(d.qty)} шт, прибуття ${fmtD(d.arrive)}, ${st}, ${pay}`;
      }).join('; ') || 'немає';

      const prompt = `Ти — керівник ланцюга постачань. Товар іде з Китаю морем.
Дата розрахунку: ${fmtD(today)}. Плече: ${leadTime} дн (замовлення ${cfg.order} + море ${cfg.sea} + порт ${cfg.port}).
Політика: мінімум ${cfg.minStock} міс, оверсток ${cfg.overStock} міс.

Позиція "${item.name}"
- розрахунковий залишок сьогодні: ${fmtN(a.stockNow)} шт (${fmtM(a.covNow)} міс)
- витрата: ${fmtN(a.monthly)} шт/міс
- свій запас закінчується: ${a.zeroDate ? fmtD(a.zeroDate) : 'немає розриву в горизонті'}${a.firstGap ? `, розрив ${a.firstGap.to - a.firstGap.from + 1} дн, добір на внутрішньому ринку ≈ ${fmtN(a.firstGap.qty)} шт` : ''}
- запасу вистачає до: ${a.coverDate ? fmtD(a.coverDate) : 'за горизонтом'}
- розрахункова дата замовлення: ${a.orderDate ? fmtD(a.orderDate) : 'не потрібно'}
- статуси поставок: ${stages}

Коротко (до 200 слів), українською:
1. Чи згоден з датою замовлення і чому.
2. Що на плечі ${leadTime} днів може зсунути строки: свята в Китаї, пік сезону, фрахт, порт, митниця, безпекова ситуація.
3. Чи бачиш ризик у поточних етапах і оплатах поставок. Врахуй: при розриві виробництво не зупиняється — сировину добирають на внутрішньому ринку України, тому питання не в простої, а в ціні, якості та наявності аналога.
4. Чи виправдано пришвидшити поставку замість закупівлі на ринку.
5. Одна конкретна дія на цей тиждень.
Без вступів і без переліку вхідних даних.`;

      const rr = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
      });
      const rd = await rr.json();
      if (!rr.ok) throw new Error(rd?.error?.message || ('HTTP '+rr.status));
      const txt = rd?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!txt) throw new Error('порожня відповідь');
      setAiText(p => Object.assign({}, p, {[item.id]: txt}));
    }catch(e){
      setAiText(p => Object.assign({}, p, {[item.id]:'Оцінку не отримано: ' + e.message}));
    }finally{
      setAiBusy(p => Object.assign({}, p, {[item.id]:false}));
    }
  };

  const exportPdf = () => {
    const el = document.getElementById('deck');
    if (!el) return;
    const prev = cfg.theme;
    document.documentElement.setAttribute('data-theme','light');
    document.body.classList.add('printing');
    setTimeout(() => {
      html2pdf().set({
        margin:[6,6,6,6], filename:`mrp_${toISO(today)}.pdf`,
        image:{type:'jpeg',quality:.95},
        html2canvas:{scale:1.4,useCORS:true,backgroundColor:'#ffffff'},
        jsPDF:{unit:'mm',format:'a3',orientation:'landscape'}
      }).from(el).save()
        .catch(() => say('PDF не сформовано', true))
        .finally(() => {
          document.body.classList.remove('printing');
          document.documentElement.setAttribute('data-theme', prev);
        });
    }, 60);
  };

  const jump = id => {
    setChartOpen(p => Object.assign({}, p, {[id]:true}));
    const el = document.getElementById('item-'+id);
    if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  };

  const theme = cfg.theme || 'dark';

  return (
    <>
      <div className="hud no-print">
        <div className="brand">
          <img src="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp" alt=""/>
          <div className="wordmark">MRP<span>·</span>DECK</div>
        </div>
        <div className="hud-tel">
          <div className="tel">Сьогодні<b className="mono">{fmtD(today)}</b></div>
          <div className="tel">Залишок на<b className={'mono '+(stale>14?'warn':'')}>{fmtD(parseISO(cfg.stockDate))}{stale>0?` · ${stale} дн тому`:''}</b></div>
          <div className="tel">Плече<b className="mono">{leadTime} дн</b></div>
          <div className="tel">Синхронізація<b className="mono">{meta.at ? meta.at.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}) : '—'}{revision?` · rev ${revision}`:''}</b></div>
          {dirty && <div className="tel">Стан<b className="warn">є незбережені зміни</b></div>}
        </div>
        <div className="hud-act">
          <button className="btn btn-ic" title={theme==='dark'?'Світла тема':'Темна тема'}
                  onClick={() => setCfg(Object.assign({}, cfg, {theme: theme==='dark'?'light':'dark'}))}>
            {theme==='dark' ? '☀' : '☾'}
          </button>
          <button className="btn" onClick={() => load(false)} disabled={busy}>{busy?'Читаю…':'Синхронізувати'}</button>
          <button className="btn btn-key" onClick={() => save()} disabled={saving || !items.length}>{saving?'Пишу…':'Зберегти'}</button>
          <button className="btn" onClick={addItem}>+ Позиція</button>
          <button className="btn" onClick={exportPdf}>PDF</button>
          <button className="btn" onClick={() => setTab(tab==='cfg'?'deck':'cfg')}>{tab==='cfg'?'До палуби':'Налаштування'}</button>
        </div>
      </div>

      {tab === 'cfg' ? (
        <div className="shell sett">
          <div className="panel pad">
            <div className="eyebrow">Підключення</div>
            <h3>Google Apps Script</h3>
            <label className="lab">Адреса скрипта (/exec)</label>
            <input className="field mono" style={{width:'100%'}} value={cfg.url}
                   onChange={e => setCfg(Object.assign({}, cfg, {url:e.target.value}))}/>
            <div className="grid3" style={{marginTop:12}}>
              <div>
                <label className="lab">Токен доступу</label>
                <input type="password" className="field mono" style={{width:'100%'}} value={cfg.token}
                       onChange={e => setCfg(Object.assign({}, cfg, {token:e.target.value}))}/>
              </div>
              <div>
                <label className="lab">Ваше ім'я — для журналу</label>
                <input className="field" style={{width:'100%'}} value={cfg.user}
                       onChange={e => setCfg(Object.assign({}, cfg, {user:e.target.value}))} placeholder="Юрій"/>
              </div>
            </div>
            <p className="hint">Токен зберігається лише у цьому браузері. Отримати: у редакторі скрипта запустити setup() і скопіювати значення з журналу виконання.</p>

            <h3>Актуальність залишку</h3>
            <label className="lab">Залишок у таблиці станом на</label>
            <input type="date" className="field mono" value={cfg.stockDate}
                   onChange={e => setCfg(Object.assign({}, cfg, {stockDate:e.target.value}))}/>
            <p className="hint">Від цієї дати списується витрата до сьогодні. Підтягується з тексту в комірці B2, якщо там є дата.</p>

            <h3>Логістичне плече, дні</h3>
            <div className="grid3">
              {[['order','Розміщення замовлення'],['sea','Море'],['port','Порт і митниця']].map(([k,l]) => (
                <div key={k}>
                  <label className="lab">{l}</label>
                  <input inputMode="decimal" className="field mono" style={{width:'100%'}} value={cfg[k]}
                         onChange={e => setCfg(Object.assign({}, cfg, {[k]:e.target.value}))}/>
                </div>
              ))}
            </div>
            <p className="hint">Разом: <b className="mono" style={{color:'var(--ion)'}}>{leadTime} дн</b></p>

            <h3>Політика запасів, місяці</h3>
            <div className="grid3">
              <div>
                <label className="lab">Мінімальний запас</label>
                <input inputMode="decimal" className="field mono" style={{width:'100%'}} value={cfg.minStock}
                       onChange={e => setCfg(Object.assign({}, cfg, {minStock:e.target.value}))}/>
              </div>
              <div>
                <label className="lab">Оверсток</label>
                <input inputMode="decimal" className="field mono" style={{width:'100%'}} value={cfg.overStock}
                       onChange={e => setCfg(Object.assign({}, cfg, {overStock:e.target.value}))}/>
              </div>
            </div>
            <p className="hint">Кома і крапка обидві приймаються.</p>

            <h3>Оцінка ризиків</h3>
            <label className="lab">Ключ Gemini</label>
            <input type="password" className="field mono" style={{width:'100%'}} value={cfg.apiKey}
                   onChange={e => setCfg(Object.assign({}, cfg, {apiKey:e.target.value}))} placeholder="AIzaSy…"/>
            <p className="hint">Необов'язково. Без ключа працює вся математика, не працює лише текстова оцінка.</p>
          </div>
        </div>
      ) : (
        <div className="shell" id="deck">
          {!cfg.url || !cfg.token ? (
            <div className="panel empty">
              <h2>Підключіть таблицю</h2>
              <p>Вкажіть адресу скрипта і токен доступу в налаштуваннях.</p>
              <button className="btn btn-key" style={{marginTop:14}} onClick={() => setTab('cfg')}>Відкрити налаштування</button>
            </div>
          ) : (
          <>
            {rows.length > 0 && (
              <div className="panel horizon">
                <div className="scan"><i></i></div>
                <div className="eyebrow">Горизонт постачання · 12 місяців</div>
                <Horizon rows={view.length?view:rows} today={today} onPick={jump} theme={theme}/>
                <div className="legend">
                  <span><i style={{background:'var(--jade)'}}></i>вище мінімуму</span>
                  <span><i style={{background:'var(--gold)'}}></i>нижче мінімуму</span>
                  <span><i style={{background:'var(--flare)'}}></i>нуль — закупівля на ринку</span>
                  <span><i style={{background:'var(--ion)',borderRadius:'50%',width:9,height:9}}></i>відвантажено</span>
                  <span><i style={{border:'2px solid var(--ion)',background:'transparent',borderRadius:'50%',width:9,height:9}}></i>ще не в дорозі</span>
                  <span><i style={{background:'var(--gold)',transform:'rotate(45deg)',width:9,height:9}}></i>дата замовлення</span>
                </div>
              </div>
            )}

            <div className="tiles">
              <div className="panel tile"><div className="k">Позицій</div><div className="v v-ion">{stat.total}</div><div className="s">під контролем</div></div>
              <div className="panel tile"><div className="k">Замовляти зараз</div><div className="v v-now">{stat.now}</div><div className="s">дата замовлення минула</div></div>
              <div className="panel tile"><div className="k">Ризик ≤ 30 днів</div><div className="v v-soon">{stat.soon}</div><div className="s">готувати заявку</div></div>
              <div className="panel tile"><div className="k">Відвантажено</div><div className="v v-ion">{stat.transit}</div><div className="s">+{stat.planned} ще не в дорозі</div></div>
              <div className="panel tile"><div className="k">Купувати на ринку</div><div className="v" style={{color:stat.gaps?'var(--flare)':'var(--dim)'}}>{stat.gaps}</div><div className="s">позицій із розривом</div></div>
              <div className="panel tile"><div className="k">Без оплати</div><div className="v" style={{color:stat.unpaid?'var(--gold)':'var(--dim)'}}>{stat.unpaid}</div><div className="s">замовлень не оплачено</div></div>
              <div className="panel tile"><div className="k">Питання до даних</div><div className="v" style={{color:stat.flags?'var(--gold)':'var(--dim)'}}>{stat.flags}</div><div className="s">перевірити рядки</div></div>
            </div>

            <div className="toolbar no-print">
              <input className="field search" placeholder="Пошук позиції" value={q} onChange={e => setQ(e.target.value)}/>
              <select className="field" value={filter} onChange={e => setFilter(e.target.value)}>
                <option value="all">Усі позиції</option>
                <option value="now">Замовляти зараз</option>
                <option value="risk">Ризик ≤ 30 днів</option>
                <option value="zero">Потрібна закупівля на ринку</option>
                <option value="unpaid">Не оплачені</option>
                <option value="over">Оверсток</option>
                <option value="flags">Питання до даних</option>
              </select>
              <select className="field" value={sort} onChange={e => setSort(e.target.value)}>
                <option value="urgency">За терміновістю</option>
                <option value="cover">За покриттям</option>
                <option value="name">За назвою</option>
                <option value="sheet">Як у таблиці</option>
              </select>
              {stale > 14 && <span className="flag" style={{padding:'7px 12px'}}>Залишок старший за {stale} дн</span>}
            </div>

            {busy && !rows.length ? <div className="panel empty">Читаю таблицю…</div> :
             !view.length ? <div className="panel empty"><h2>Нічого не знайдено</h2><p>Змініть фільтр або пошуковий запит.</p></div> :
             view.map((r,i) => (
               <Card key={r.item.id} item={r.item} a={r.a} index={i} theme={theme}
                     onChange={(f,v) => change(r.item.id, f, v)}
                     onRemove={() => removeItem(r.item.id, r.item.name)}
                     chart={!!chartOpen[r.item.id]} ai={!!aiOpen[r.item.id]}
                     onChart={() => setChartOpen(p => Object.assign({}, p, {[r.item.id]: !p[r.item.id]}))}
                     onAi={() => runAi(r.item, r.a)}
                     aiText={aiText[r.item.id]} aiBusy={!!aiBusy[r.item.id]}/>
             ))}
          </>)}
        </div>
      )}

      {toast && <div className={'toast'+(toast.err?' err':'')}>{toast.text}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
